---
apiVersion: 1
providers:
  - name: k8s-storage-dashboards
    orgId: 1
    folder: "Kubernetes Storage & KubeVirt"
    type: file
    disableDeletion: false
    editable: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/k8s-storage
      foldersFromFilesStructure: false
