---
# Reproducible Cloud-Init NoCloud configuration for Ubuntu 24.04 KubeVirt VMs.
# SECURITY NOTICE:
#   - Never commit private keys, API tokens, or hardcoded passwords to Git.
#   - Replace <OPERATOR_SSH_PUBLIC_KEY> before applying to a target cluster.
#   - Installs qemu-guest-agent (required for KubeVirt guest OS reporting, quiesced
#     snapshots, and hot-plug / post-migration connectivity checks) plus fio/nvme-cli.
apiVersion: v1
kind: Secret
metadata:
  name: ubuntu-vm-cloudinit
  namespace: kubevirt-workloads
  labels:
    app.kubernetes.io/name: ubuntu-vm-cloudinit
    app.kubernetes.io/component: vm-initialization
    app.kubernetes.io/part-of: k8s-high-performance-storage
type: Opaque
stringData:
  userdata: |
    #cloud-config
    preserve_hostname: false
    manage_etc_hosts: true
    users:
      - name: ubuntu
        groups: [sudo]
        shell: /bin/bash
        lock_passwd: true
        sudo: ["ALL=(ALL) NOPASSWD:ALL"]
        ssh_authorized_keys:
          - "<OPERATOR_SSH_PUBLIC_KEY>"
    package_update: true
    packages:
      - qemu-guest-agent
      - fio
      - nvme-cli
      - lsscsi
    write_files:
      - path: /usr/local/bin/verify-vm-storage.sh
        permissions: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          echo "=== Hostname & Uptime ==="
          hostname && uptime
          echo "=== CPU & Memory (for hot-plug verification) ==="
          nproc && lscpu | grep -E 'Socket|Core|CPU\(s\)' || true
          free -m
          echo "=== Block Devices ==="
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT,MODEL
          if [ -b /dev/vdb ] && [ ! -b /dev/vdc ]; then
            echo "[INFO] Secondary disk /dev/vdb detected."
          fi
    runcmd:
      - systemctl enable --now qemu-guest-agent
      - mkdir -p /var/lib/verify-storage
      - date -u +"cloud-init-ready %Y-%m-%dT%H:%M:%SZ" > /var/lib/verify-storage/boot-marker.txt
  networkdata: |
    version: 2
    ethernets:
      enp1s0:
        dhcp4: true
