# ==============================================================================
# containerd 2.3.x LTS Reference Configuration (Schema Version 3)
# Project: Deploy High-Performance Storage for Kubernetes (SWFW_5S_08)
# Target OS: Ubuntu Server 24.04 LTS (Target Multi-Node Cluster ONLY)
#
# IMPORTANT:
#   - This configuration targets containerd 2.3.x LTS (e.g. 2.3.6 / 2.3.7) on
#     target Kubernetes nodes (Candidate B).
#   - Do NOT blindly overwrite local WSL2 host containerd while Docker workloads run.
#   - On target nodes, generate the baseline with `containerd config default` and
#     ensure `SystemdCgroup = true` matches KubeletConfiguration.
# ==============================================================================

version = 3
root = '/var/lib/containerd'
state = '/run/containerd'

[grpc]
  address = '/run/containerd/containerd.sock'
  uid = 0
  gid = 0

[plugins]
  [plugins.'io.containerd.cri.v1.images']
    snapshotter = 'overlayfs'
    disable_snapshot_annotations = true

    [plugins.'io.containerd.cri.v1.images'.pinned_images]
      sandbox = 'registry.k8s.io/pause:3.10.2'

    [plugins.'io.containerd.cri.v1.images'.registry]
      config_path = '/etc/containerd/certs.d:/etc/docker/certs.d'

  [plugins.'io.containerd.cri.v1.runtime']
    enable_selinux = false
    enable_unprivileged_ports = false
    enable_unprivileged_icmp = false

    [plugins.'io.containerd.cri.v1.runtime'.containerd]
      default_runtime_name = 'runc'

      [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes]
        [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc]
          runtime_type = 'io.containerd.runc.v2'
          sandboxer = 'podsandbox'

          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc.options]
            SystemdCgroup = true

    [plugins.'io.containerd.cri.v1.runtime'.cni]
      bin_dirs = ['/opt/cni/bin']
      conf_dir = '/etc/cni/net.d'
      max_conf_num = 1

