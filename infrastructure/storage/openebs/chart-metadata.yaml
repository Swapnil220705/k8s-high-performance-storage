metadata:
  verificationDate: "2026-11-11"
  helmRepository:
    name: openebs
    url: https://openebs.github.io/openebs
  umbrellaChart:
    name: openebs
    version: "4.6.2"
    appVersion: "4.6.2"
  replicatedStorageSubchart:
    name: mayastor
    version: "2.12.2"
    appVersion: "2.12.2"
  supportingSubcharts:
