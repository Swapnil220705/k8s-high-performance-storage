---
# Default Safe ReadWriteMany (RWX) Filesystem StorageClass for Live Migration.
# Requires kubernetes-csi/csi-driver-nfs (pinned chart v4.9.0) + mayastor-nfs-server Service.
# Trade-off: Adds Linux VFS & NFSv4.1 TCP translation overhead (~lower IOPS than direct NVMe block),
# but provides standards-compliant POSIX shared locking without experimental block multi-attach risks.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-mayastor-rwx
  labels:
    app.kubernetes.io/name: csi-driver-nfs
    app.kubernetes.io/instance: csi-driver-nfs
    app.kubernetes.io/component: storageclass
    app.kubernetes.io/part-of: k8s-high-performance-storage
    app.kubernetes.io/version: "v4.9.0"
  annotations:
    description: "Default safe ReadWriteMany Filesystem StorageClass via csi-driver-nfs backed by Mayastor RWO"
provisioner: nfs.csi.k8s.io
parameters:
  server: "mayastor-nfs-server.storage-nfs.svc.cluster.local"
  share: "/"
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - "nfsvers=4.1"
  - "hard"
  - "timeo=600"
  - "retrans=2"
