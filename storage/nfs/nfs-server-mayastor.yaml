---
# Isolated namespace for the Clustered/Shared NFS Gateway backed by Mayastor RWO storage.
# Provides standards-compliant ReadWriteMany (RWX) Filesystem exports for KubeVirt VM live migration.
apiVersion: v1
kind: Namespace
metadata:
  name: storage-nfs
  labels:
    app.kubernetes.io/name: storage-nfs
    app.kubernetes.io/component: nfs-gateway
    app.kubernetes.io/part-of: k8s-high-performance-storage
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Underlying 3-replica Mayastor NVMe-oF RWO Filesystem PVC backing the NFS export directory.
# Note: Only this gateway Pod mounts the ext4 volume RWO; multiple worker nodes then mount
# NFSv4.1 shares concurrently as RWX without violating ext4 single-writer semantics.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-backing-mayastor-rwo
  namespace: storage-nfs
  labels:
    app.kubernetes.io/name: mayastor-nfs-server
    app.kubernetes.io/component: nfs-backing-store
    app.kubernetes.io/part-of: k8s-high-performance-storage
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: mayastor-nvme-r3-ext4
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mayastor-nfs-server
  namespace: storage-nfs
  labels:
    app.kubernetes.io/name: mayastor-nfs-server
    app.kubernetes.io/instance: mayastor-nfs-server
    app.kubernetes.io/component: nfs-server
    app.kubernetes.io/part-of: k8s-high-performance-storage
    app.kubernetes.io/version: "12"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mayastor-nfs-server
      app.kubernetes.io/instance: mayastor-nfs-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mayastor-nfs-server
        app.kubernetes.io/instance: mayastor-nfs-server
        app.kubernetes.io/component: nfs-server
        app.kubernetes.io/part-of: k8s-high-performance-storage
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 30
      containers:
        - name: nfs-server
          image: "docker.io/itsthenetwork/nfs-server-alpine:12"
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARED_DIRECTORY
              value: "/exports"
          # Kernel nfsd export table & rpc.nfsd bindings require privileged/SYS_ADMIN in container
          securityContext:
            privileged: true
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
            - name: mountd
              containerPort: 20048
              protocol: TCP
            - name: rpcbind-tcp
              containerPort: 111
              protocol: TCP
            - name: rpcbind-udp
              containerPort: 111
              protocol: UDP
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: nfs-backing-store
              mountPath: /exports
      volumes:
        - name: nfs-backing-store
          persistentVolumeClaim:
            claimName: nfs-backing-mayastor-rwo
---
apiVersion: v1
kind: Service
metadata:
  name: mayastor-nfs-server
  namespace: storage-nfs
  labels:
    app.kubernetes.io/name: mayastor-nfs-server
    app.kubernetes.io/component: nfs-service
    app.kubernetes.io/part-of: k8s-high-performance-storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mayastor-nfs-server
    app.kubernetes.io/instance: mayastor-nfs-server
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
      protocol: TCP
    - name: mountd
      port: 20048
      targetPort: 20048
      protocol: TCP
    - name: rpcbind-tcp
      port: 111
      targetPort: 111
      protocol: TCP
    - name: rpcbind-udp
      port: 111
      targetPort: 111
      protocol: UDP
